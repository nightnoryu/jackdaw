[settings]
dotfiles.relative_symlinks = true

[dotfiles]
"~/.config/hypr" = { source = "hypr", mode = "symlink" }
"~/.config/waybar" = { source = "waybar", mode = "symlink" }
"~/.config/wofi" = { source = "wofi", mode = "symlink" }

"~/.config/fish" = { source = "fish", mode = "symlink" }
"~/.config/kitty" = { source = "kitty", mode = "symlink" }

"~/.config/nvim" = { source = "nvim", mode = "symlink" }
"~/.config/git" = { source = "git", mode = "symlink" }
"~/.gitconfig" = { source = "dot-gitconfig", mode = "copy" }

"~/.config/scripts" = { source = "scripts", mode = "symlink" }
"~/pictures/wallpapers" = { source = "wallpapers", mode = "symlink" }
