[bootstrap.packages]
"pacman:hyprland" = "latest"
"pacman:hypridle" = "latest"
"pacman:hyprlock" = "latest"
"pacman:hyprpaper" = "latest"
"pacman:hyprsunset" = "latest"
"pacman:brightnessctl" = "latest"
"pacman:waybar" = "latest"
"pacman:wofi" = "latest"
"pacman:mpv" = "latest"
"pacman:fish" = "latest"
"pacman:kitty" = "latest"
"pacman:yazi" = "latest"
"pacman:neovim" = "latest"
"pacman:fzf" = "latest"
"pacman:ripgrep" = "latest"
"pacman:fd" = "latest"

[settings]
dotfiles.relative_symlinks = true

[dotfiles]
"~/.config/hypr" = { source = "hypr", mode = "symlink" }
"~/.config/waybar" = { source = "waybar", mode = "symlink" }
"~/.config/wofi" = { source = "wofi", mode = "symlink" }
"~/.config/mpv" = { source = "mpv", mode = "symlink" }

"~/.config/fish" = { source = "fish", mode = "symlink" }
"~/.config/kitty" = { source = "kitty", mode = "symlink" }
"~/.config/yazi" = { source = "yazi", mode = "symlink" }

"~/.config/nvim" = { source = "nvim", mode = "symlink" }
"~/.config/git" = { source = "git", mode = "symlink" }
"~/.gitconfig" = { source = "dot-gitconfig", mode = "copy" }

"~/.config/scripts" = { source = "scripts", mode = "symlink" }
"~/pictures/wallpapers" = { source = "wallpapers", mode = "symlink" }
